name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quilp
          POSTGRES_USER: quilp
          POSTGRES_PASSWORD: quilp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quilp -d quilp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://quilp:quilp_dev@127.0.0.1:5432/quilp
      DATABASE_APP_URL: postgresql://quilp_app:quilp_app_dev@127.0.0.1:5432/quilp
      REDIS_URL: redis://127.0.0.1:6379
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_JWT_AUDIENCE: ${{ secrets.SUPABASE_JWT_AUDIENCE }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REDIRECT_URI: http://localhost:3000/api/v1/email-connections/gmail/callback
      MAILTRAP_USER: ${{ secrets.MAILTRAP_USER }}
      MAILTRAP_PASS: ${{ secrets.MAILTRAP_PASS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma client
      run: npx prisma generate --schema packages/db/prisma/schema.prisma

    - name: Run Prisma migrations
      run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      
    - name: Run lint
      run: npm run lint
      
    - name: Run tests
      run: npm run test
