version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quilp
      POSTGRES_USER: quilp
      POSTGRES_PASSWORD: quilp_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
